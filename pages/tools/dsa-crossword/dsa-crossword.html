<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Crossword Puzzle | Algo Infinity Verse</title>
  <meta name="description" content="Test your DSA terminology recall with interactive crossword puzzles. Three difficulty levels: Easy, Medium, Hard. 10–15 words each." />

  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="dsa-crossword.css" />

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = storedTheme || (prefersLight ? 'light' : 'dark');
        if (theme === 'light') {
          document.documentElement.classList.add('light-mode');
        } else {
          document.documentElement.classList.remove('light-mode');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="dsa-crossword">
  <!-- Skip link -->
  <a href="#dcw-main" class="skip-link">Skip to main content</a>

  <!-- Scroll to top -->
  <button type="button" id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to top">
    <i class="fas fa-arrow-up" aria-hidden="true"></i>
  </button>

  <!-- Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <main id="dcw-main" tabindex="-1">
    <!-- ═══ HERO ═══ -->
    <section class="dcw-hero">
      <div class="dcw-hero-content">
        <h1>
          DSA Terminology
          <span class="dcw-hero-accent">Crossword</span>
        </h1>
        <p>
          Reinforce DSA vocabulary through active recall. Fill in the grid by
          solving clues — faster than flashcards, way more fun.
        </p>

        <!-- ═══ STATS BAR ═══ -->
        <div class="dcw-stats-bar">
          <div class="dcw-stat">
            <span id="dcwTimerDisplay">— —</span>
            <label>Time</label>
          </div>
          <div class="dcw-stat">
            <span id="dcwRevealCount">0</span>
            <label>Reveals</label>
          </div>
          <div class="dcw-stat">
            <span id="dcwSolvedCount">0</span>
            <label>Solved</label>
          </div>
          <div class="dcw-stat dcw-stat-best">
            <span id="dcwBestTime">—</span>
            <label>Best</label>
          </div>
        </div>

        <!-- ═══ START TIMER ═══ -->
        <div class="dcw-start-bar">
          <button type="button" id="dcwStartBtn" class="dcw-btn dcw-btn-primary">
            <i class="fas fa-play"></i> Start Puzzle
          </button>
        </div>

        <!-- ═══ DIFFICULTY SELECTOR ═══ -->
        <div class="dcw-diff-bar">
          <span class="dcw-diff-label"><i class="fas fa-layer-group"></i> Difficulty</span>
          <div class="dcw-diff-options" id="dcwDiffOptions" role="radiogroup" aria-label="Puzzle difficulty">
            <button type="button" class="dcw-diff-btn" data-diff="easy" role="radio" aria-checked="true" tabindex="0">
              <i class="fas fa-seedling"></i> Easy
            </button>
            <button type="button" class="dcw-diff-btn" data-diff="medium" role="radio" aria-checked="false" tabindex="-1">
              <i class="fas fa-fire"></i> Medium
            </button>
            <button type="button" class="dcw-diff-btn" data-diff="hard" role="radio" aria-checked="false" tabindex="-1">
              <i class="fas fa-skull"></i> Hard
            </button>
          </div>
          <button type="button" id="dcwNewPuzzleBtn" class="dcw-new-btn" aria-label="Start a new puzzle">
            <i class="fas fa-redo"></i> New Puzzle
          </button>
        </div>
      </div>
    </section>

    <!-- ═══ MAIN GAME AREA ═══ -->
    <section class="dcw-game-section" aria-label="Crossword puzzle game">
      <div class="container">
        <div class="dcw-layout">
          <!-- Crossword Grid -->
          <div class="dcw-grid-panel">
            <div class="dcw-grid-container" id="dcwGridContainer">
              <div class="dcw-grid-wrap" id="dcwGridWrap" role="grid" aria-label="Crossword puzzle grid">
                <!-- Grid rendered by JS -->
              </div>
            </div>

            <!-- Action buttons -->
            <div class="dcw-actions">
              <button type="button" id="dcwCheckBtn" class="dcw-btn dcw-btn-secondary" title="Mark wrong cells red">
                <i class="fas fa-check-double"></i> Check
              </button>
              <button type="button" id="dcwRevealBtn" class="dcw-btn dcw-btn-accent" title="Fill in one word">
                <i class="fas fa-eye"></i> Reveal Word
              </button>
              <button type="button" id="dcwSolutionBtn" class="dcw-btn dcw-btn-ghost" title="Show full solution with animation">
                <i class="fas fa-lightbulb"></i> Solution
              </button>
            </div>
          </div>

          <!-- Clue Panel -->
          <div class="dcw-clue-panel" aria-label="Clues">
            <div class="dcw-clue-header">
              <i class="fas fa-list" aria-hidden="true"></i>
              <h2>Clues</h2>
            </div>

            <div class="dcw-clue-tabs" role="tablist" aria-label="Clue direction">
              <button type="button" class="dcw-clue-tab active" role="tab" aria-selected="true" data-direction="across" id="dcwTabAcross">
                <i class="fas fa-arrow-right"></i> Across
              </button>
              <button type="button" class="dcw-clue-tab" role="tab" aria-selected="false" data-direction="down" id="dcwTabDown">
                <i class="fas fa-arrow-down"></i> Down
              </button>
            </div>

            <div class="dcw-clue-list-wrap" id="dcwClueListWrap">
              <ul class="dcw-clue-list" id="dcwClueList" role="tabpanel" aria-label="Across clues">
                <!-- Rendered by JS -->
              </ul>
            </div>

            <!-- Current clue highlight -->
            <div class="dcw-current-clue" id="dcwCurrentClue" aria-live="polite">
              <span class="dcw-cc-label">Current clue:</span>
              <span class="dcw-cc-text" id="dcwCcText">Click a cell to start</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══ COMPLETION MODAL ═══ -->
    <div class="dcw-modal" id="dcwCompletionModal" role="dialog" aria-modal="true" aria-labelledby="dcwModalTitle" hidden>
      <div class="dcw-modal-backdrop" id="dcwModalBackdrop"></div>
      <div class="dcw-modal-content">
        <div class="dcw-modal-header">
          <div class="dcw-modal-badge">
            <i class="fas fa-trophy" aria-hidden="true"></i>
            Puzzle Complete!
          </div>
          <h3 id="dcwModalTitle">Congratulations!</h3>
        </div>
        <div class="dcw-modal-body" id="dcwModalBody">
          <div class="dcw-modal-score" id="dcwModalScore">00:00</div>
          <div class="dcw-modal-stats" id="dcwModalStats">
            <div class="dcw-modal-stat">
              <i class="fas fa-clock"></i>
              <span id="dcwModalTime">00:00</span>
              <label>Time</label>
            </div>
            <div class="dcw-modal-stat">
              <i class="fas fa-eye"></i>
              <span id="dcwModalReveals">0</span>
              <label>Reveals</label>
            </div>
            <div class="dcw-modal-stat">
              <i class="fas fa-trophy"></i>
              <span id="dcwModalBest">—</span>
              <label>Best Time</label>
            </div>
          </div>
        </div>
        <div class="dcw-modal-footer">
          <button type="button" id="dcwModalNextBtn" class="dcw-btn dcw-btn-primary">
            <i class="fas fa-play"></i> Next Puzzle
          </button>
          <button type="button" id="dcwModalCloseBtn" class="dcw-btn dcw-btn-ghost">
            <i class="fas fa-times"></i> Close
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/auth.js"></script>
  <script src="/bootstrap-legacy.js"></script>
  <script src="/script.js"></script>
  <script type="module" src="/dist/legacy-bundle.mjs"></script>
  <script src="/theme.js"></script>
  <script src="dsa-crossword.js"></script>

  <script>
    if (typeof loadPartial === 'function') {
      loadPartial('navbar-placeholder', '/partials/navbar.html');
    }
  </script>
</body>
</html>
